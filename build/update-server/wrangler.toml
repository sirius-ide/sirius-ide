# Deploy with:  npx wrangler deploy --config build/update-server/wrangler.toml
#
# The worker needs no secrets, no KV and no bindings — it reads public GitHub
# releases. Free-tier limits are far above what update checks generate.

name = "sirius-update"
main = "worker.mjs"
compatibility_date = "2026-08-01"

# Uncomment once you own the domain and have added it to Cloudflare. Until then
# the worker is reachable at https://sirius-update.<your-subdomain>.workers.dev,
# which is a perfectly good updateUrl.
# routes = [
#   { pattern = "update.siriuside.com", custom_domain = true }
# ]

# The R2 bucket and its custom domain are live; update responses point
# downloads at the zero-egress path, with GitHub as automatic fallback.
[vars]
DL_BASE = "https://dl.siriuside.com"

# The worker reads release metadata from its own bucket — no external API, no
# rate limits. GitHub remains the fallback when the manifest is absent.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "sirius-releases"
