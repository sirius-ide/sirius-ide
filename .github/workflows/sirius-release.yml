name: Sirius Release

# Tagging v1.2.3 builds and publishes a release. The update server reads that
# release, so a tag is the whole ship process:
#
#   linux (x64, arm64)  tarball + REH server + .deb/.rpm, both legs on x64  ─┐
#                       runners: arm64 is cross-compiled through the aarch64 │
#                       glibc-2.28 sysroot, the way upstream builds it       ├─ release (tag only)
#   windows             installer                                            │    GitHub Release,
#   install-test        the .deb/.rpm/tarball/server in clean Debian 12,     │    provenance, R2 mirror,
#                       Ubuntu 22.04, Rocky 9 containers, x64 AND arm64      │    update manifest
#   arch                sirius-ide-bin built and installed on Arch          ─┘
#                                                                              └─ arch-publish: the [sirius] pacman repo
#                                                                                 (rehearsed in --dry-run on a branch)
#
# A branch dispatch runs everything up to (and not including) the tag-gated
# publish jobs, which is how a release candidate is rehearsed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish to the insider channel'
        type: boolean
        default: false
      allow_missing_packages:
        description: 'Ship even if the .deb/.rpm or the Arch package could not be built (a package that exists but fails to install still blocks)'
        type: boolean
        default: false
      arch_pkgrel:
        description: 'pkgrel for the Arch package; bump it to republish a tag whose package already exists in the repository'
        type: string
        default: '1'

permissions:
  contents: write
  # Provenance attestations: CI signs a statement binding each asset's digest to
  # this workflow, this commit and this run, verifiable with
  # `gh attestation verify <file> --owner <org>`.
  id-token: write
  attestations: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The build jobs run `npm ci` with ignore-scripts=false — arbitrary lifecycle
    # scripts from the whole dependency tree. They have no reason to hold the
    # workflow-level write token; only Publish does.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both legs run on the x64 22.04 image and compile their native
          # modules inside the glibc-2.28 sysroot (see "Install dependencies"):
          # x64 with Chromium's clang and a statically linked libc++, arm64 with
          # the sysroot's aarch64 gcc — upstream's product-build-linux.yml, arch
          # for arch. That, and only that, is what makes the deb/rpm installable
          # on Debian 12, Ubuntu 22.04 and RHEL/Rocky 9.
          # ubuntu-22.04 on purpose: the rpm dependency strings come from the
          # RUNNER's `/usr/lib/rpm/find-requires` and must match
          # build/linux/rpm/dep-lists.ts byte for byte, and that list was
          # generated on upstream's 22.04 agent. (The deb side is different: it
          # runs a Chromium-pinned dpkg-shlibdeps.pl fetched at prepare time, so
          # when 22.04 retires, re-check the rpm list first.) Both tools read
          # aarch64 ELF on this x64 host: find-requires is rpm's libelf-based
          # rpmdeps, and dpkg-shlibdeps drives objdump, whose generic
          # elf64-little target covers the dynamic section and symbol versions.
          - arch: x64
            runner: ubuntu-22.04
            triple: x86_64-linux-gnu
          # arm64 is CROSS-COMPILED here, not built on ubuntu-24.04-arm. The
          # sysroot's aarch64 toolchain is a Canadian cross — x86_64 binaries
          # that cannot execute on the arm64 runner — and a native build floors
          # at that runner's glibc 2.38 / GLIBCXX 3.4.31, which no distro in
          # INSTALL.md has: the v1.118.6 arm64 tarball did not run on Debian 12
          # arm64 (PROJECT-STATE.md section 11). Nothing in this job executes
          # what this leg builds; the two runtime smoke steps run on the native
          # leg only, and the arm64 proof is the install-test legs on the arm64
          # runner, which install the packages and run the editor and server.
          - arch: arm64
            runner: ubuntu-22.04
            triple: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v7

      # preinstall.ts rejects a mismatched major, so read the pin rather than
      # hardcoding a version that will drift.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Arch's npm and the runner's npm both move; the guard wants < 11.2.0.
      - name: Pin npm below the version the build rejects
        run: npm install -g npm@10

      # python-is-python3: setup-env.sh pipes Chromium's update.py into `python`,
      # not `python3`, and Ubuntu ships no unversioned alias. The runtime
      # libraries after libnss3 are what the Electron binary hard-links; the
      # x64 smoke step below is the first thing in this job that executes it.
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libx11-dev libxkbfile-dev \
            fakeroot rpm dpkg-dev pkg-config python-is-python3 \
            libnss3 libnspr4 libgtk-3-0 libgbm1 libatspi2.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libdrm2 libxdamage1 libxcomposite1 libxfixes3 libxrandr2
          # Ubuntu 24.04 renamed libasound2 to libasound2t64; the arm64 runner is 24.04.
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # ~290 MB of toolchain on x64 (two sysroots, clang, libc++); on arm64 the
      # two sysroots alone, and the other paths below simply do not exist. The
      # pinned versions live in four different files — the sysroot release tag
      # in install-sysroot.ts, the Chromium revision in setup-env.sh, the
      # Electron target in .npmrc and the libc++ artifact version
      # libcxx-fetcher.ts reads from package.json — so hash those rather than
      # transcribing version numbers that would silently go stale.
      - name: Cache sysroot and clang toolchain
        uses: actions/cache@v6
        with:
          path: |
            .build/sysroots
            .build/CR_Clang
            .build/libcxx-objects
            .build/libcxx_headers
            .build/libcxxabi_headers
          key: linux-toolchain-${{ matrix.arch }}-${{ hashFiles('build/azure-pipelines/linux/setup-env.sh', 'build/linux/debian/install-sysroot.ts', 'build/checksums/vscode-sysroot.txt', '.npmrc', 'package.json') }}

      # setup-env.sh runs build/linux/libcxx-fetcher.ts, which imports
      # @electron/get, extract-zip and debug. Those are build/package.json
      # devDependencies; the root `npm ci` only populates build/node_modules from
      # its postinstall, i.e. after setup-env.sh needs them. Upstream installs
      # build/ first for exactly this reason, with the token: build/'s
      # @vscode/ripgrep pulls its binary from GitHub in an install script.
      - name: Install build-script dependencies
        working-directory: build
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ONE step, deliberately. setup-env.sh only *exports* CC/CXX/CXXFLAGS/
      # LDFLAGS, and Actions gives every `run:` a fresh shell — sourcing it in a
      # step of its own configures a shell that immediately exits, and `npm ci`
      # then quietly uses the runner's gcc and libstdc++. That failure is silent
      # until prepare-deb, where dependencies-generator.ts throws over libstdc++
      # and libc6 (>= 2.39) entries the amd64 reference list does not contain.
      # Do NOT route the flags through $GITHUB_ENV either: they would leak
      # `-nostdinc++ -stdlib=libc++ --sysroot=...` into every later step.
      # `npm ci` runs build/npm/preinstall.ts itself (it is the preinstall
      # lifecycle script), inside this same toolchain env.
      # The same script also exports VSCODE_REMOTE_CC/CXX/CXXFLAGS/LDFLAGS, the
      # glibc-2.28 gcc sysroot that postinstall.ts uses for remote/ — so the REH
      # server's native modules get their floor from this step too.
      # On arm64 the script's aarch64 branch exports the same sysroot's
      # aarch64-linux-gnu-gcc (no clang/libc++ there, which is why the aarch64
      # reference lists are libstdc++ lists), and npm_config_arch is what makes
      # node-gyp compile every module for arm64 with it — and what points the
      # @vscode/ripgrep and electron postinstalls, and later the Electron and
      # Node package downloads, at aarch64 binaries. Both halves are needed:
      # the first cross attempt (before c87ef00) set npm_config_arch without the
      # toolchain, so the runner's own gcc emitted x86_64 modules into an arm64
      # Electron, and nothing noticed until the app was run.
      - name: Install dependencies
        run: |
          set -e
          export VSCODE_ARCH='${{ matrix.arch }}'
          export npm_config_arch='${{ matrix.arch }}'
          source ./build/azure-pipelines/linux/setup-env.sh
          # The token stays for `npm ci` too. install-sysroot.ts needs it, and so
          # does @vscode/ripgrep's postinstall, which fetches its binary from
          # api.github.com — anonymously that is 60 requests/hour shared across
          # every runner behind the same egress IP, and the Windows leg of
          # rehearsal 36335699671 hit exactly that 403. It is the job-scoped,
          # read-only, auto-expiring token these jobs are already limited to
          # (`permissions: contents: read`), reaching lockfile-pinned lifecycle
          # scripts — the posture every VS Code build runs with.
          npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ github.token }}

      # No toolchain env here on purpose: the packaging tasks compile no native
      # code. Every .node was built by `npm ci` above; this bundles and copies.
      - name: Build
        run: npm run gulp vscode-linux-${{ matrix.arch }}-min
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # The check that turns "the package installs" into "the package runs".
      # Scope mirrors dependencies-generator.ts exactly, so a pass here means the
      # dep-list comparison below cannot be surprised. x64 must be libc++-only
      # with a glibc-2.28 floor — that is what the amd64 reference lists encode.
      # arm64 is gcc-built, so it may link libstdc++ up to the GLIBCXX_3.4.26
      # the aarch64 reference lists end at, on the same glibc floor. The
      # runner's objdump reads the aarch64 binaries through binutils' generic
      # elf64-little target (the dynamic section and versioned symbols are
      # architecture-independent), so one script gates both legs.
      - name: Verify ABI floor
        env:
          APP_DIR: ${{ github.workspace }}/../VSCode-linux-${{ matrix.arch }}
          MAX_GLIBC: '2.28'
          MAX_GLIBCXX: ${{ matrix.arch == 'x64' && 'none' || '3.4.26' }}
        run: bash ./build/sirius/abi-floor.sh

      # dlopen every rebuilt native module under the real Electron ABI — the
      # .node files themselves, not the package entry points, which lazily load
      # and swallow errors. ~3s, no display needed, and the cheapest possible
      # proof that swapping libstdc++ for libc++ did not break the modules the
      # editor loads at startup. Only where the runner can execute the build:
      # the arm64 binaries cannot run on this x64 runner, and their equivalent
      # proof is the install-test legs on the arm64 runner, which run the
      # installed editor and server (a module that fails to load throws in the
      # main process there — that is how the native arm64 build was caught).
      - name: Smoke - native modules load
        if: (runner.arch == 'X64' && matrix.arch == 'x64') || (runner.arch == 'ARM64' && matrix.arch == 'arm64')
        run: |
          cd "${{ github.workspace }}/../VSCode-linux-${{ matrix.arch }}"
          ELECTRON_RUN_AS_NODE=1 ./sirius -e '
            const { execSync } = require("child_process");
            const path = require("path");
            const files = execSync("find resources/app/node_modules -name \"*.node\" -not -path \"*/obj.target/*\"", { encoding: "utf8" })
              .trim().split("\n").filter(Boolean);
            const windowsOnly = /windows-foreground-love|deviceid\/build\/Release\/windows\.node|win32-|-msvc-/;
            let ok = 0, bad = 0;
            for (const f of files) {
              if (windowsOnly.test(f)) { console.log("skip " + f); continue; }
              try { process.dlopen({ exports: {} }, path.resolve(f)); ok++; console.log("ok   " + f); }
              catch (e) { bad++; console.log("FAIL " + f + " :: " + String(e.message).split("\n")[0]); }
            }
            console.log(ok + " loaded, " + bad + " failed");
            if (ok < 7) { console.log("::error::expected at least 7 native modules to load, got " + ok); process.exit(1); }
            process.exit(bad ? 1 : 0);'

      - name: Package tarball
        run: |
          tar -czf sirius-linux-${{ matrix.arch }}.tar.gz -C .. VSCode-linux-${{ matrix.arch }}
          sha256sum sirius-linux-${{ matrix.arch }}.tar.gz > sirius-linux-${{ matrix.arch }}.tar.gz.sha256

      # ---- The REH server ------------------------------------------------
      # product.json's serverDownloadUrlTemplate promises
      # sirius-server-${os}-${arch}.tar.gz on every release, and until this step
      # existed no job produced it, so Open Remote-SSH and every other remote
      # extension 404ed on connect. This tree builds with esbuild
      # (build/buildConfig.ts useEsbuildTranspile), so the client task above
      # bundled straight from src/ and left no transpiled out-build for the
      # legacy `minify-vscode-reh` gulp task to read; upstream's core-ci bundles
      # the server the same way the client was bundled, with build/next, and
      # that is what runs here (the extensions and out-build/date it needs were
      # produced by the client task). The -ci task then fetches the pinned Node
      # from nodejs.org, checked against build/checksums/nodejs.txt, and copies
      # remote/node_modules.
      - name: Build server
        run: |
          node build/next/index.ts bundle --out out-vscode-reh-min --target server --minify --mangle-privates --nls
          npm run gulp vscode-reh-linux-${{ matrix.arch }}-min-ci
          mv "${{ github.workspace }}/../vscode-reh-linux-${{ matrix.arch }}" \
             "${{ github.workspace }}/../sirius-server-linux-${{ matrix.arch }}"
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # The server links libstdc++ (gcc sysroot, not clang/libc++), so the cap
      # is the version its own bin/helpers/check-requirements.sh promises a
      # remote host, not "none" — on both architectures.
      - name: Verify server ABI floor
        env:
          APP_DIR: ${{ github.workspace }}/../sirius-server-linux-${{ matrix.arch }}
          LAYOUT: server
          MAX_GLIBC: '2.28'
          MAX_GLIBCXX: '3.4.25'
        run: bash ./build/sirius/abi-floor.sh

      # The bundled Node and the server's own requirements check, on this
      # runner — where the runner can execute it; the arm64 server is started
      # by the arm64 install-test legs instead. The container legs below run it
      # on the distros users have.
      - name: Smoke - server runs
        if: (runner.arch == 'X64' && matrix.arch == 'x64') || (runner.arch == 'ARM64' && matrix.arch == 'arm64')
        run: |
          S="${{ github.workspace }}/../sirius-server-linux-${{ matrix.arch }}"
          "$S/bin/helpers/check-requirements.sh"
          "$S/bin/sirius-server" --version
          want="$(sed -n 's/^[[:space:]]*"version": "\(.*\)",/\1/p' package.json | head -1)"
          got="$("$S/bin/sirius-server" --version | head -1)"
          [ "$got" = "$want" ] || { echo "::error::sirius-server --version reported '$got', package.json says '$want'"; exit 1; }

      - name: Package server
        run: |
          tar -czf sirius-server-linux-${{ matrix.arch }}.tar.gz -C .. sirius-server-linux-${{ matrix.arch }}
          sha256sum sirius-server-linux-${{ matrix.arch }}.tar.gz > sirius-server-linux-${{ matrix.arch }}.tar.gz.sha256

      # The `-build-deb` / `-build-rpm` tasks do NOT chain their `-prepare-` half
      # (only the snap task does, build/gulpfile.vscode.linux.ts:293-306). Calling
      # build alone runs dpkg-deb in .build/linux/deb/<arch>, a directory only
      # prepare creates, and Node reports the missing cwd as `spawn /bin/sh
      # ENOENT` — a missing shell, which it is not. deb and rpm also get their own
      # steps: under one `bash -e` block a failing rpm discarded a .deb that had
      # already built, because the copy-out never ran.
      - name: Package deb
        id: deb
        continue-on-error: true
        shell: bash
        env:
          VSCODE_ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
          # prepare-deb resolves the sysroot again; point it at the copy
          # setup-env.sh already fetched so it short-circuits on the .stamp file
          # instead of pulling another 112 MB into /tmp. (The Debian bullseye
          # sysroot for the matrix arch that dpkg-shlibdeps resolves libraries
          # against is fetched by the task itself, into /tmp; nothing caches it.)
          VSCODE_SYSROOT_DIR: ${{ github.workspace }}/.build/sysroots/glibc-2.28-gcc-10.5.0
        run: |
          set -eo pipefail
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-deb
          npm run gulp vscode-linux-${{ matrix.arch }}-build-deb
          find .build/linux/deb -name '*.deb' -exec cp -v {} . \;
          compgen -G '*.deb' > /dev/null

      # STRIP is what the spec's `%define __strip` expands to. The spec disables
      # brp-strip itself, but rpmbuild's remaining brp-* scripts still take the
      # macro, and the runner's strip cannot read an aarch64 object — so, like
      # upstream's prepare-rpm step, hand it the sysroot's strip for the target
      # triple, on both legs (on x64 it is the same binutils as the host's).
      - name: Package rpm
        id: rpm
        continue-on-error: true
        shell: bash
        env:
          VSCODE_ARCH: ${{ matrix.arch }}
          STRIP: ${{ github.workspace }}/.build/sysroots/glibc-2.28-gcc-10.5.0/${{ matrix.triple }}/${{ matrix.triple }}/bin/strip
        run: |
          set -eo pipefail
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-rpm
          npm run gulp vscode-linux-${{ matrix.arch }}-build-rpm
          find .build/linux/rpm -name '*.rpm' -exec cp -v {} . \;
          compgen -G '*.rpm' > /dev/null

      # Upload BEFORE the gate: a packaging failure must fail the job, but it
      # must not also throw away the tarball and whichever package did build —
      # those are what you inspect to diagnose it, and what a deliberate
      # ship-without-packages would publish. A *.deb/*.rpm pattern that matches
      # nothing only warns, because the tarball pattern still matches.
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            sirius-linux-${{ matrix.arch }}.tar.gz*
            sirius-server-linux-${{ matrix.arch }}.tar.gz*
            *.deb
            *.rpm

      # INSTALL.md promises both formats, x64 and arm64. A missing package is a release
      # regression, not a footnote in a job summary nobody opens on a green run —
      # which is exactly how this hid for five releases. The per-package steps
      # tolerate failure only so one cannot discard the other's output; THIS step
      # is what fails the job, and a failed linux job skips Publish.
      # Recovery, once you have decided to ship without them anyway:
      #   gh workflow run sirius-release.yml --ref <tag> -f allow_missing_packages=true
      # (dispatch against the TAG, not the branch — a branch dispatch is skipped
      # by the Publish gate. "Re-run failed jobs" replays the push event with no
      # inputs, so it cannot reach this path.)
      - name: Packaging gate
        if: success() || failure()
        shell: bash
        run: |
          shopt -s nullglob
          debs=(*.deb); rpms=(*.rpm)
          deb="${debs[*]}"; rpm="${rpms[*]}"
          {
            echo "### Linux ${{ matrix.arch }} packaging"
            echo
            echo "| package | step | files |"
            echo "| --- | --- | --- |"
            echo "| deb | ${{ steps.deb.outcome }} | ${deb:-none} |"
            echo "| rpm | ${{ steps.rpm.outcome }} | ${rpm:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${{ steps.deb.outcome }}" ]; then
            echo "packaging did not run — the job failed earlier; see the steps above"
            exit 0
          fi
          fail=0
          [ -n "$deb" ] || { echo "::error title=No .deb for ${{ matrix.arch }}::'Package deb' outcome: ${{ steps.deb.outcome }}"; fail=1; }
          [ -n "$rpm" ] || { echo "::error title=No .rpm for ${{ matrix.arch }}::'Package rpm' outcome: ${{ steps.rpm.outcome }}"; fail=1; }
          if [ "$fail" = 1 ] && [ "${{ inputs.allow_missing_packages || 'false' }}" != 'true' ]; then
            echo "INSTALL.md promises both packages. To ship without them anyway:"
            echo "  gh workflow run sirius-release.yml --ref <tag> -f allow_missing_packages=true"
            exit 1
          fi

  # The proof that "the package builds" became "the package installs and runs":
  # apt and dnf resolve the generated dependency lists from each distribution's
  # own repositories, every shipped binary resolves its libraries, the editor
  # comes up under Xvfb, and the REH server starts and answers /version. These
  # are the distributions INSTALL.md names as the floor. Publish requires them.
  # The arm64 legs run the same script on arm64 hardware (GitHub's
  # ubuntu-24.04-arm runner, the distribution's own arm64 image in a container)
  # and are the ONLY place the cross-compiled arm64 build is executed before it
  # ships — the linux job cannot run what it built for the other architecture —
  # so they are required, not advisory.
  install-test:
    name: Install ${{ matrix.name }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
      # Chromium's renderer uses /dev/shm; Docker's default 64 MB is too small.
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Debian 12 x64 (.deb)'
            runner: ubuntu-latest
            image: 'debian:12'
            kind: deb
            arch: x64
          - name: 'Ubuntu 22.04 x64 (.deb)'
            runner: ubuntu-latest
            image: 'ubuntu:22.04'
            kind: deb
            arch: x64
          - name: 'Rocky 9 x64 (.rpm)'
            runner: ubuntu-latest
            image: 'rockylinux:9'
            kind: rpm
            arch: x64
          - name: 'Debian 12 arm64 (.deb)'
            runner: ubuntu-24.04-arm
            image: 'debian:12'
            kind: deb
            arch: arm64
          - name: 'Ubuntu 22.04 arm64 (.deb)'
            runner: ubuntu-24.04-arm
            image: 'ubuntu:22.04'
            kind: deb
            arch: arm64
          - name: 'Rocky 9 arm64 (.rpm)'
            runner: ubuntu-24.04-arm
            image: 'rockylinux:9'
            kind: rpm
            arch: arm64
          # The tarball is what arm64 users installed before the packages
          # existed, and the leg that measured the native build not running on
          # Debian 12 arm64 (v1.118.6): it stays, and it now has to pass.
          - name: 'Debian 12 arm64 (tarball)'
            runner: ubuntu-24.04-arm
            image: 'debian:12'
            kind: tarball
            arch: arm64
    steps:
      # git before checkout: without it the action falls back to a REST tarball
      # of the whole repository and ignores sparse-checkout.
      - name: Container prerequisites
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          else
            dnf -y -q install git >/dev/null
          fi
      # Non-cone patterns: the cone mode's implicit root files are not
      # reliable on the git 2.34 that ubuntu:22.04 ships, and package.json is
      # needed for the version check.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /package.json
            /build/sirius/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Install and run
        env:
          KIND: ${{ matrix.kind }}
          ARCH: ${{ matrix.arch }}
          DIST: dist
          EXPECTED_COMMIT: ${{ github.sha }}
          ALLOW_MISSING: ${{ inputs.allow_missing_packages || 'false' }}
        run: |
          export EXPECTED_VERSION="$(sed -n 's/^[[:space:]]*"version": "\(.*\)",/\1/p' package.json | head -1)"
          bash build/sirius/install-test.sh

  # sirius-ide-bin, built from this run's own x64 tarball inside an Arch
  # container, installed there with pacman resolving every declared dependency,
  # and run. Building from the artifact rather than the GitHub release URL the
  # PKGBUILD names is what lets a branch dispatch rehearse this leg; the bytes
  # are the same tarball the release publishes. The repository update itself is
  # rehearsed in --dry-run mode here and performed by arch-publish after the
  # GitHub release exists.
  arch:
    name: Arch Linux package
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The same escape hatch as the Packaging gate: with allow_missing_packages
    # a failed Arch build does not block the release, and the repository is
    # simply not updated (arch-publish keys on the `built` output, not on the
    # job result). Without it, no Arch package means no release.
    continue-on-error: ${{ inputs.allow_missing_packages == true }}
    outputs:
      built: ${{ steps.done.outputs.built }}
    container:
      image: archlinux:base-devel
    steps:
      # git before checkout, so the action can do a sparse checkout instead of
      # falling back to a REST tarball of the whole repository.
      - name: Container prerequisites
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            build/arch
            build/sirius
      - uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: dist
      - name: Build, install and run
        run: |
          version="$(sed -n 's/^[[:space:]]*"version": "\(.*\)",/\1/p' package.json | head -1)"
          if [ "${{ github.ref_type }}" = tag ] && [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::package.json says $version but the tag is ${{ github.ref_name }}; bump before tagging (PROJECT-STATE.md section 12)"
            exit 1
          fi
          bash build/arch/build.sh dist/sirius-linux-x64.tar.gz "$version" out
        env:
          PKGREL: ${{ inputs.arch_pkgrel || '1' }}
      - uses: actions/upload-artifact@v7
        with:
          name: arch-x86_64
          path: |
            out/*.pkg.tar.zst
            out/*.pkg.tar.zst.sha256
      - id: done
        run: echo built=true >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    # Pinned: windows-latest now carries Visual Studio 18, which node-gyp 11
    # cannot classify ("unknown version undefined"), so native modules fail to
    # configure. The 2022 image carries VS2022, which it fully understands.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@10
      # @vscode/ripgrep's postinstall fetches its binary from api.github.com.
      # Anonymous, that is 60 requests/hour shared across every runner behind
      # the same egress IP: rehearsal run 36335699671 failed here with HTTP 403
      # after five retries. The job-scoped read-only token lifts the limit —
      # the same thing upstream does on every platform.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build
        run: npm run gulp vscode-win32-x64-min
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      # Upstream's pipeline runs this between build and installer: it stages the
      # background-updater binaries into the app's tools/ directory, which
      # code.iss line 108 requires unconditionally.
      - name: Stage installer tools
        run: npm run gulp vscode-win32-x64-inno-updater
      - name: Build installer
        run: npm run gulp vscode-win32-x64-system-setup
      - name: Collect installer
        shell: bash
        run: |
          find .build/win32-x64 -name '*.exe' -exec cp {} sirius-win32-x64-setup.exe \;
          sha256sum sirius-win32-x64-setup.exe > sirius-win32-x64-setup.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: win32-x64
          path: sirius-win32-x64-setup.exe*

  release:
    name: Publish
    needs: [linux, windows, install-test, arch]
    # A release is a tag. Without the ref_type guard a workflow_dispatch on a
    # BRANCH reaches this job — and `sirius` is the repository default branch, so
    # it is the pre-selected option in the Run-workflow dropdown. That would mint
    # real provenance attestations for untagged mid-branch binaries and write
    # latest-stable.json with productVersion "sirius", which the update worker
    # serves to every installed editor as its primary source, with no
    # version-ordering check and no way back. `always()` is the separate,
    # deliberate allowance: Windows signing is not set up yet, so a failed
    # Windows build must not block a Linux release.
    # The install test and the Arch package are required too: a package that
    # does not install on the distributions INSTALL.md names is not shippable,
    # and allow_missing_packages does not override that — it only tolerates a
    # package that is ABSENT (the Packaging gate, install-test.sh and the arch
    # job each skip an absent package themselves when it is set). !cancelled()
    # rather than always(): a cancelled run must not publish.
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.linux.result == 'success'
      && needs.install-test.result == 'success' && needs.arch.result == 'success'
    runs-on: ubuntu-latest
    # Two tag runs must never interleave their writes to the release, the R2
    # mirror or latest-*.json.
    concurrency:
      group: sirius-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }

      # The editor compares commits, not versions. Without this the update
      # server can never tell one build from another.
      - name: Stamp the build commit
        run: echo "${{ github.sha }}" > dist/commit.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      # The runner's own gh, with the job token, instead of a third-party
      # action on a floating major tag: this is the one job that holds
      # contents:write, id-token:write and the R2 secrets, and nothing it runs
      # should be code that can move underneath it. A re-run of an existing
      # release replaces the assets rather than failing.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --verify-tag --generate-notes \
              $([ "$PRERELEASE" = true ] && echo --prerelease)
          fi

      # Mirror the assets to R2 so downloads ride the zero-egress CDN path.
      # Gated on a repo *variable* so CI stays green before Cloudflare is wired;
      # the keys are an R2 API token scoped to this one bucket, nothing wider.
      # R2_ENDPOINT carries the Cloudflare account id. It is an identifier, not a
      # credential — the endpoint rejects unsigned requests — and it is STILL
      # visible in this step's rendered env block, because repository variables
      # are not masked. Moving it to a repository secret would mask it; that
      # needs the secret to exist first. See PROJECT-STATE §7.
      - name: Mirror release to R2
        if: vars.R2_ENDPOINT != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          aws s3 cp dist/ "s3://sirius-releases/releases/${{ github.ref_name }}/" \
            --recursive --endpoint-url "$R2_ENDPOINT"

      # The manifest the update worker reads instead of the GitHub API — a
      # bucket read has no rate limits, so update checks cannot flake.
      - name: Publish update manifest
        if: vars.R2_ENDPOINT != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          TAG: ${{ github.ref_name }}
          QUALITY: ${{ inputs.prerelease && 'insider' || 'stable' }}
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, time
          assets = {}
          for sidecar in glob.glob('dist/*.sha256'):
              assets[os.path.basename(sidecar)[:-7]] = open(sidecar).read().split()[0]
          json.dump({
              'tag': os.environ['TAG'],
              'commit': open('dist/commit.txt').read().strip(),
              'productVersion': os.environ['TAG'].lstrip('v'),
              'timestamp': int(time.time() * 1000),
              'assets': assets,
          }, open('latest.json', 'w'))
          PYEOF
          aws s3 cp latest.json "s3://sirius-releases/latest-$QUALITY.json" \
            --endpoint-url "$R2_ENDPOINT"

  # The [sirius] pacman repository, updated by the same run that published the
  # release — the step that used to be done by hand after every tag, and that
  # the repository lagged on until someone remembered. On a branch it runs the
  # same script in --dry-run, so the tooling and the repo-add mechanics are
  # rehearsed; on a tag it runs after Publish, so the release the PKGBUILD's
  # source URL names exists. Stable only: the repository has no insider
  # channel, and every Arch user would get a prerelease on their next -Syu.
  # Runs on the plain runner with Ubuntu's pacman-package-manager for repo-add
  # and vercmp, rather than in a rolling-release container that would have to
  # `pacman -Syu` the whole distribution before touching the R2 credentials.
  arch-publish:
    name: ${{ github.ref_type == 'tag' && 'Publish Arch repository' || 'Rehearse Arch repository' }}
    needs: [arch, release]
    if: >-
      !cancelled() && needs.arch.outputs.built == 'true'
      && (github.ref_type != 'tag' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The repository update is a read-modify-write of one database; serialise
    # it across runs so a slower run for an older tag cannot clobber a newer one
    # (the script also refuses downgrades on its own).
    concurrency:
      group: sirius-arch-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: build/sirius
      - uses: actions/download-artifact@v8
        with:
          name: arch-x86_64
          path: out
      - name: Install repo-add
        run: |
          sudo apt-get update -qq
          # libarchive-tools supplies the bsdtar repo-add reads .PKGINFO with;
          # without it every zstd package is "not a package file".
          sudo apt-get install -y -qq pacman-package-manager libarchive-tools >/dev/null
          repo-add --version
          vercmp 1.118.6 1.118.5
      - name: Rehearse the repository update
        if: github.ref_type != 'tag'
        run: bash build/sirius/publish-arch-repo.sh out/sirius-ide-bin-*.pkg.tar.zst --dry-run
      - name: repo-add and upload
        if: github.ref_type == 'tag' && vars.R2_ENDPOINT != '' && !inputs.prerelease
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: bash build/sirius/publish-arch-repo.sh out/sirius-ide-bin-*.pkg.tar.zst
