# siriuside.com — build on every change to the site or the documents it renders, test it, and
# deploy to Cloudflare Pages when the Pages-only token exists. Without the secret the job builds
# and tests and stops green, so the workflow can land before the token does.
#
# Secrets / variables (repository settings):
#   CLOUDFLARE_PAGES_TOKEN   an API token with ONLY  Account → Cloudflare Pages: Edit
#                            (never the full-control token from build/cloudflare/README.md)
#   CLOUDFLARE_ACCOUNT_ID    repository variable; the account id (an identifier, not a secret)
name: Sirius website

on:
  push:
    branches: [sirius]
    paths:
      - 'website/**'
      - 'INSTALL.md'
      - 'PRIVACY.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - 'LICENSE.txt'
      - '.github/workflows/sirius-website.yml'
  # After a tag's release run, so the download page and the changelog list the new release.
  # Not `release: published`: CI publishes with GITHUB_TOKEN, and GitHub starts no workflow
  # from an event that token caused (v1.118.9's release never rebuilt the site), but
  # workflow_run is exempt. Whatever the run's conclusion — Publish can succeed while an
  # optional job fails.
  workflow_run:
    workflows: [Sirius Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirius-website
  cancel-in-progress: true

jobs:
  site:
    name: Build, test, deploy
    # A release run on a branch is a rehearsal and publishes nothing; only a tag's matters.
    if: github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            website
            INSTALL.md
            PRIVACY.md
            ROADMAP.md
            SECURITY.md
            LICENSE.txt
            extensions/sirius-ai/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}   # lifts the anonymous rate limit for the release data
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Browser for the tests
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Smoke, links, accessibility
        working-directory: website
        run: npm test

      - name: Lighthouse budgets
        working-directory: website
        env:
          CHROME_PATH: ''
        run: npm run lighthouse

      - name: Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: website/test-results/lighthouse
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Pages
        if: env.HAS_PAGES_TOKEN == 'true' && github.event_name != 'pull_request'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name sirius-website --branch sirius --commit-hash "$GITHUB_SHA"

      - name: Not deployed
        if: env.HAS_PAGES_TOKEN != 'true'
        run: echo "::notice::Built and tested; not deployed — set CLOUDFLARE_PAGES_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy (see .github/workflows/sirius-website.yml)."
